.hero h1{color:#fff}

.hero .resume{background:#ffffff1f;border-color:#ffffff55;color:#fff}

.card:hover{transform:translateY(-4px);box-shadow:0 1px 0 var(--line),0 18px 40px color-mix(in srgb,var(--ink) 16%,transparent)}
.card .ch{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.card .ch h3{font-size:20px}

.card .foot{padding-bottom:18px}
.card ul{border-top:0}

.c-cefr .bub span{border-color:#121633}.c-cefr .bub span.f{background:#121633}
.card .big-ic{position:absolute;right:16px;top:14px;font-family:Unbounded,sans-serif;font-weight:900;font-size:34px;line-height:1;opacity:.18}
.how{background:var(--paper)}
.step{border:0;background:var(--bg);border-radius:20px;padding:22px}
.step .n{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:Unbounded,sans-serif;font-size:26px;color:#fff;background:var(--blue)}

.res-top .big{color:var(--blue)}
.big,.clock{font-family:Unbounded,sans-serif}

function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    else if(c===')'){i++;let n='';while(/\d/.test(f[i]||''))n+=f[i++];const o=st.pop();for(const k in o)add(st[st.length-1],k,o[k]*(+n||1))}

{title:'The Return of the Saxaul',text:`A. For centuries the saxaul tree has been one of the few plants able to survive in the sandy deserts of Central Asia. Its roots can reach groundwater more than ten metres below the surface, and its tiny, scale-like leaves lose very little moisture to the sun. Traditionally, nomadic families used its dense wood for fuel, because it burns slowly and produces intense heat.
B. During the twentieth century, however, saxaul forests shrank dramatically. Heavy cutting for firewood, combined with grazing by large herds, left many areas bare. Without roots to hold it in place, the sand began to move, burying roads and fields. The drying of the Aral Sea made the situation worse: winds lifted salt and dust from the exposed seabed and carried it hundreds of kilometres.
C. Since the early 2000s, large planting programmes have tried to reverse this damage. Workers collect seeds in late autumn, when the fruit has dried, and sow them on the former seabed in winter so that melting snow can help them germinate. In especially harsh places, young trees grown in nurseries are planted by hand. Survival rates vary widely; on salty clay, fewer than half of the seedlings may live through their first summer.
D. Scientists are now testing ways to improve these results. One approach involves planting saxaul alongside other hardy shrubs that shade the soil and trap blowing sand. Another uses small straw grids, pressed into the sand in squares about one metre wide, which slow the wind at ground level. Early trials suggest that seedlings protected by such grids grow faster in their first two years.
E. Supporters of the programmes point out that a mature saxaul forest does more than stop dust storms. Its fallen leaves add organic matter to the soil, and its shade allows grasses to return, providing food for animals. Critics, though, warn that planting on a huge scale is expensive and that success should be measured over decades, not seasons.`,

{title:'Sleep and Memory',text:`A. For a long time, sleep was seen simply as a period of rest, a time when the brain switched off. Research over the past fifty years has shown that this view is wrong. During sleep the brain is highly active, and some of this activity appears to play a central role in turning the experiences of the day into lasting memories.
B. Sleep is not uniform. Each night we pass through several cycles, each lasting roughly ninety minutes. Early in the night, cycles contain more deep, slow-wave sleep; towards morning, rapid eye movement (REM) sleep, the stage most associated with vivid dreaming, becomes longer. Many researchers believe that slow-wave sleep is especially important for facts and events, while REM sleep may help with skills and emotional memories.
C. In one well-known type of experiment, volunteers learn a list of word pairs in the evening. Half then sleep normally, while the other half stay awake through the night. When tested the next day, those who slept usually recall more pairs. Interestingly, the advantage remains even when the sleep-deprived group is allowed to rest the following afternoon, which suggests that the timing of sleep after learning matters.
D. Brain recordings offer clues about what happens. In rats that have explored a maze, groups of cells in the hippocampus fire in the same order during later sleep as they did while the animal was running. This "replay" seems to strengthen the connections that store the route. Similar patterns have been detected in humans, although measuring them is more difficult.
E. These findings have practical implications. Students who stay up all night before an exam may be undermining the very learning they hope to protect. A short nap after studying can also help, although naps longer than about thirty minutes may leave people feeling heavy and confused for a while after waking.`,

{title:'Paper on the Silk Road',text:`A. Paper was invented in China at least two thousand years ago, and for several centuries the technique remained largely unknown elsewhere. Early Chinese paper was made from the inner bark of mulberry trees, hemp and old rags, which were soaked, beaten into pulp, spread on a screen and dried in the sun.
B. A popular story claims that the secret travelled west after the Battle of Talas in 751, when Chinese prisoners supposedly taught papermaking in Samarkand. Many historians now treat this account with caution. Fragments of paper found along trade routes suggest that the material was already in use in parts of Central Asia before the battle, carried by merchants and monks.
C. Whatever its exact origins, the paper industry of Samarkand became famous. Local makers used cotton and linen fibres, and the city's water mills powered heavy hammers that beat the pulp. Samarkand paper was valued for its smooth, polished surface, which allowed ink to flow evenly, and it was exported as far as Baghdad.
D. The spread of paper had far-reaching effects. It was much cheaper than parchment, which was made from animal skin, and lighter than the clay tablets and wooden strips used in some regions. As a result, books became more affordable, government offices kept more detailed records, and libraries grew rapidly in cities such as Bukhara and Baghdad.
E. Europe adopted paper much later. The first paper mills in Spain appeared around the twelfth century, and it took several hundred more years for paper to replace parchment completely. When printing presses spread in the fifteenth century, however, the demand for cheap paper rose sharply, and mills multiplied across the continent.`,

{title:'Urban Heat Islands',text:`A. On a summer afternoon, the centre of a large city can be several degrees warmer than the countryside around it. This effect, known as the urban heat island, occurs because materials such as asphalt, concrete and brick absorb sunlight during the day and release it slowly after dark. As a result, the difference between city and countryside is often greatest at night.
B. Several other factors add to the problem. Tall buildings trap heat between them and block cooling breezes. Air conditioners, cars and factories release waste heat directly into the streets. And because cities have fewer plants, there is less evaporation from leaves, a process that naturally cools the surrounding air.
C. The consequences are not only uncomfortable. Hot nights prevent people from recovering after hot days, which increases health risks for older residents and young children. Higher temperatures also raise electricity demand, as more air conditioners are switched on, and can worsen air pollution by speeding up chemical reactions that form ground-level ozone.
D. Cities around the world are experimenting with solutions. Some paint roofs white or use light-coloured paving, which reflects more sunlight. Others plant trees along streets and create "green roofs" covered with soil and vegetation. In some older cities, traditional designs such as narrow shaded streets, courtyards with fountains and thick walls are being studied again, since they kept homes cool long before electricity existed.
E. No single measure is enough on its own. Studies suggest that combining trees, reflective surfaces and better building design produces the largest benefits. Planners also stress the importance of placing new parks where the most vulnerable people live, rather than only in wealthy districts.`,

{title:'The Language of Whales',text:`A. Humpback whales are famous for their songs: long, complex sequences of moans, cries and clicks that can last for twenty minutes and be repeated for hours. Only males sing, and most singing takes place in the warm waters where whales breed during winter, which has led scientists to believe that the songs play a role in mating.
B. One remarkable feature of these songs is that all the males in a population sing roughly the same song at any given time, yet the song changes gradually over months. New phrases are added and old ones are dropped. In the South Pacific, researchers have even observed entirely new songs spreading from east to west across different populations, like a fashion moving from one city to another.
C. Recording whale sounds is technically demanding. Sound travels about four times faster in water than in air, and noise from ships can mask quieter calls. Researchers use underwater microphones called hydrophones, sometimes attached to buoys that record for months, and increasingly rely on computer programs to sort thousands of hours of audio.
D. Not all whale communication is song. Sperm whales produce patterns of clicks known as codas, and groups of related females share particular coda styles. Some scientists describe these shared styles as dialects, suggesting that whales, like humans, may learn some of their communication from the group they grow up in.
E. Researchers are cautious, however, about calling any of these systems a language. Human languages combine a limited set of sounds into an unlimited number of meaningful sentences. Whether whale sounds carry meaning in the same way is unknown, and it remains possible that their main purpose is to identify the caller or to attract attention.`,

function draw(bk,items,n,flt,used){const seen=seenGet(bk),groups={};
 items.forEach(r=>{if(used.has(r.id)||(flt&&!flt(r)))return;(groups[r.g]=groups[r.g]||[]).push(r)});
 const gs=shuffle(Object.keys(groups)).map(g=>{const a=shuffle(groups[g]);return a.filter(r=>!seen.has(r.id)).concat(a.filter(r=>seen.has(r.id)))});
 const out=[];let i=0;while(out.length<n&&gs.some(g=>g.length)){const g=gs[i++%gs.length];if(g.length){const r=g.shift();out.push(r);used.add(r.id)}}
 return out}

 if(s.kind==='satrw'){const b=bank('eng');const hard=ctx.m2hard;const f=s.m2?(hard?r=>r.d>=2:r=>r.d<=2):null;
  const rd0=ctx.satr||(ctx.satr=shuffle(SATR));const rs=rd0.splice(0,4).map((x,i)=>{const o=shuffle(x.o.map((t,j)=>({t:t,c:j===x.a})));return{t:'mc',id:'satr'+i+secIdx,p:x.p,q:T(x.q),opts:o.map(z=>z.t),a:o.findIndex(z=>z.c),d:2}});

  const v=draw('eng',b,8,byG(0),used),tr=draw('eng',b,4,byG(6),used),gr=draw('eng',b,11,r=>[1,2,3,4,5,7,8].includes(r.g),used);
  const conv=x=>{const m=toMC(x);const parts=String(m.q.en).split('\n\n');if(parts.length>1){m.q=T(parts[0]);m.p=parts.slice(1).join('\n\n')}return m};

 if(it.t==='w')return `<div class="ritem"><b>${i+1}.</b> ${esc(tr(it.prompt))}<p class="mut" style="margin-top:6px">${t('written')}: ${(a||'').trim()?((a.trim().match(/\S+/g)||[]).length+' '+t('words')):t('none')}</p></div>`;
 if(it.t==='s')return `<div class="ritem"><b>${t('part')} ${it.part}.</b> ${esc(it.title)}</div>`;
 if(it.t==='ab')return `<div class="ritem"><b>${i+1}.</b>${it.parts.map((p,k)=>{const ok=isRight(p,(a||[])[k]);return `<div class="q" style="margin-top:4px"><span class="${ok?'tagok':'tagno'}">${'ab'[k]}) ${ok?'✓':'✕'}</span>${esc(tr(p.q))}</div><div class="mut">${t('your')}: ${esc((a||[])[k]||t('empty'))} · ${t('right')}: <b class="ok">${esc(typeof p.v==='number'?num(p.v,l):p.v)} ${esc(unitTxt(p.u,l))}</b></div>`}).join('')}</div>`;
 const ok=isRight(it,a);const right=it.t==='mc'?LET[it.a]+') '+optText(it.opts[it.a],l):Array.isArray(it.v)?it.v[0]:(typeof it.v==='number'?num(it.v,l):it.v)+(it.u?' '+unitTxt(it.u,l):'');const yours=a===undefined||a===''?t('empty'):it.t==='mc'?LET[a]+') '+optText(it.opts[a],l):a;
 return `<div class="ritem"><div class="q"><span class="${ok?'tagok':'tagno'}">${i+1} ${ok?'✓':'✕'}</span>${esc(tr(it.q))}</div>${ok?'':`<div class="mut" style="margin-top:4px">${t('your')}: ${esc(yours)}</div>`}<div>${t('right')}: <b class="ok">${esc(right)}</b></div></div>`}
function calcEval(s){const x=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.').replace(/π|pi/gi,'(Math.PI)').replace(/\^/g,'**').replace(/√/g,'sqrt').replace(/\b(sqrt|sin|cos|tan|log|abs)\(/g,'Math.$1(');if(!/^[\d+\-*/().\sMathPIsqrtincoalgb]*$/.test(x))return 'Error';try{const v=Function('"use strict";return ('+x+')')();return isFinite(v)?String(rd(v,8)):'Error'}catch(e){return 'Error'}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
 if(act==='mclose'&&e.target!==el)return;
 const i=el.dataset.i!==undefined?+el.dataset.i:null;
 switch(act){
 case 'home':e.preventDefault();VIEW='home';render();break;
 case 'go':if(el.dataset.to){e.preventDefault();if(VIEW!=='home'){VIEW='home';render()}const tg=document.getElementById(el.dataset.to);if(tg)tg.scrollIntoView({behavior:'smooth'});break}S.cur=i;const sp=$('#popwrap');if(sp)sp.innerHTML='';save();renderRun();break;
 case 'lang':LANG=el.dataset.l;ls.set('tz_lang',LANG);render();break;
 case 'filter':FILTER=el.dataset.f;render();setTimeout(()=>{const x=$('#exams');if(x)x.scrollIntoView()},0);break;
 case 'intro':CUR_EX=el.dataset.ex;VIEW='intro';render();break;
 case 'startfull':startExam(CUR_EX,null);break;
 case 'startsec':startExam(CUR_EX,+el.dataset.i);break;
 case 'resume':S=ls.get('tz_run',null);if(S){VIEW=S.between?'between':'run';render()}break;
 case 'discard':ls.del('tz_run');render();break;
 case 'clearhist':ls.del('tz_hist');render();break;
 case 'pick':{const o=+el.dataset.o;S.ans[AK(i)]=S.ans[AK(i)]===o&&EX().fam!=='ielts'?undefined:o;save();renderRun();break}
 case 'cross':{const k=AK(i),o=+el.dataset.o;S.cross[k]=S.cross[k]||{};S.cross[k][o]=!S.cross[k][o];save();renderRun();break}
 case 'mark':S.mark[AK(S.cur)]=!S.mark[AK(S.cur)];save();renderRun();break;
 case 'next':S.cur=Math.min(S.cur+1,EX().fam==='sat'?ITEMS().length:ITEMS().length-1);save();renderRun();break;
 case 'prev':S.cur=Math.max(0,S.cur-1);save();renderRun();break;
 case 'pgrid':{const w=$('#popwrap');w.innerHTML=w.innerHTML?'':`<div class="pop"><b>${esc(tr(SEC().name))}</b>${pgrid(ITEMS())}<div style="margin-top:12px"><button class="btn sm ghost" data-act="go" data-i="${ITEMS().length}">${t('review')}</button></div></div>`;break}
 case 'ig':S.grp=+el.dataset.g;save();renderRun();setTimeout(()=>{const q=document.getElementById('q'+i);if(q)q.scrollIntoView({block:'center'})},0);break;
 case 'gprev':S.grp=Math.max(0,(S.grp||0)-1);save();renderRun();break;
 case 'gnext':S.grp=(S.grp||0)+1;save();renderRun();break;
 case 'play':playPart();break;
 case 'retry':S.ttsFail=false;save();playPart();break;
 case 'stimer':speakTimer();break;
 case 'finish':confirmFinish();break;
 case 'dofinish':modal('');finishSection(false);break;
 case 'nextsec':beginSection();break;
 case 'mclose':modal('');break;
 case 'dirs':modal(`<h3>${t('dirs')}</h3><p style="margin-top:10px">${t('dir_sat')}</p><div class="row"><button class="btn" data-act="mclose">OK</button></div>`);break;
 case 'ref':modal(`<h3>${t('ref')}</h3><ul style="line-height:1.9;margin-top:10px"><li>A = πr², C = 2πr</li><li>A = lw, A = ½bh</li><li>c² = a² + b²</li><li>30°-60°-90°: x, x√3, 2x · 45°-45°-90°: s, s, s√2</li><li>V = lwh, V = πr²h, V = ⁴⁄₃πr³, V = ⅓πr²h</li><li>360° in a circle · 180° in a triangle</li></ul><div class="row"><button class="btn" data-act="mclose">OK</button></div>`);break;
 case 'calc':modal(`<h3>${t('calc')}</h3><input class="ans" id="calcin" style="width:100%;margin-top:12px" placeholder="${t('calc_ph')}" autocomplete="off"><div class="big" id="calcout" style="font-size:36px;margin-top:12px">0</div><p class="hint">sqrt( ) · sin( ) · cos( ) · tan( ) · π · ^</p><div class="row"><button class="btn" data-act="mclose">OK</button></div>`);setTimeout(()=>{const c=$('#calcin');if(c)c.focus()},0);break;
 }});
document.addEventListener('input',e=>{const el=e.target;const act=el.dataset&&el.dataset.act;
 if(el.id==='calcin'){$('#calcout').textContent=el.value.trim()?calcEval(el.value):'0';return}
 if(!act||!S)return;const i=+el.dataset.i;
 if(act==='type'){S.ans[AK(i)]=el.value;save();const it=ITEMS()[i];if(it&&EX().fam==='ielts')refreshTabs()}
 else if(act==='typeab'){const k=AK(i);const a=(S.ans[k]||['','']).slice();a[+el.dataset.k]=el.value;S.ans[k]=a;save();refreshOmr()}
 else if(act==='typew'){S.ans[AK(i)]=el.value;save();wc(el)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='self'){const last=ls.get('tz_last',null);if(!last)return;last.S.self=last.S.self||{};last.S.self[el.dataset.k]=el.value;const r=computeResult(last.S);last.RES=r;ls.set('tz_last',last);const h=ls.get('tz_hist',[]);if(h.length){h[h.length-1].s=r.headline;ls.set('tz_hist',h)}render()}});
document.addEventListener('keydown',e=>{if(VIEW!=='run'||!S)return;if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const s=SEC();if(s.kind==='listen'||s.kind==='read'||s.kind==='write'||s.kind==='speak')return;if(e.key==='ArrowRight'){S.cur=Math.min(S.cur+1,EX().fam==='sat'?ITEMS().length:ITEMS().length-1);save();renderRun()}else if(e.key==='ArrowLeft'){S.cur=Math.max(0,S.cur-1);save();renderRun()}});
function refreshOmr(){const its=ITEMS();document.querySelectorAll('.orow').forEach((r,j)=>{const q=its[j],aa=S.ans[AK(j)];if(q.t==='ab')r.querySelectorAll('.sq').forEach((x,k)=>x.classList.toggle('on',!!(aa&&aa[k])));else if(q.t!=='mc'){const x=r.querySelector('.sq');if(x)x.classList.toggle('on',answered(q,aa))}})}
function refreshTabs(){const its=ITEMS();document.querySelectorAll('.ptab button').forEach(b=>{const j=+b.dataset.i;b.classList.toggle('a',answered(its[j],S.ans[AK(j)]))})}

render();
